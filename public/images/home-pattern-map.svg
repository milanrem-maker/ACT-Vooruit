    <text x="788" y="624" fill="#FBF7F1" font-family="Avenir Next, Segoe UI, sans-serif" font-size="34" font-weight="700">richting</text>
    <text x="788" y="670" fill="#F4EBDF" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22">kleine stap</text>
