<svg width="1200" height="860" viewBox="0 0 1200 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ruimte maken</title>
  <desc id="desc">Rustige abstracte illustratie met gedachten die niet worden weggeduwd maar ruimte krijgen.</desc>
  <rect width="1200" height="860" rx="64" fill="#DDE6DF"/>
  <circle cx="214" cy="174" r="128" fill="#FBF7F1"/>
  <circle cx="990" cy="690" r="142" fill="#F7D8C8"/>
  <g filter="url(#shadow)">
    <rect x="230" y="218" width="740" height="424" rx="56" fill="#FBF7F1"/>
  </g>
  <circle cx="444" cy="430" r="94" fill="#F4EBDF"/>
  <circle cx="600" cy="430" r="94" fill="#EADBC5"/>
  <circle cx="756" cy="430" r="94" fill="#F7D8C8"/>
  <path d="M396 430C422 402 466 402 492 430" stroke="#476150" stroke-width="12" stroke-linecap="round"/>
  <path d="M552 430C578 402 622 402 648 430" stroke="#476150" stroke-width="12" stroke-linecap="round"/>
  <path d="M708 430C734 402 778 402 804 430" stroke="#476150" stroke-width="12" stroke-linecap="round"/>
  <text x="600" y="570" text-anchor="middle" fill="#231F1A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="34" font-weight="700">ruimte maken</text>
  <text x="600" y="616" text-anchor="middle" fill="#4A4036" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22">niet wegduwen, wel anders vasthouden</text>
