<svg width="1200" height="860" viewBox="0 0 1200 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rechte proceslijn van kennismaking naar evaluatie</title>
  <desc id="desc">Een rustige horizontale proceslijn met vier stappen: kennismaken, intake, sessies en evalueren.</desc>
  <rect width="1200" height="860" rx="64" fill="#231F1A"/>
  <circle cx="1040" cy="140" r="150" fill="#BF6D48" opacity="0.24"/>
  <circle cx="160" cy="720" r="160" fill="#476150" opacity="0.28"/>
  <text x="92" y="132" fill="#FBF7F1" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" letter-spacing="8">WERKWIJZE</text>
  <text x="92" y="196" fill="#FBF7F1" font-family="Palatino Linotype, Book Antiqua, serif" font-size="66">Rustige opbouw, duidelijke stappen.</text>
  <line x1="160" y1="462" x2="1040" y2="462" stroke="#F4EBDF" stroke-width="16" stroke-linecap="round"/>
  <line x1="160" y1="462" x2="1040" y2="462" stroke="#DF9B78" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 34"/>
  <g>
    <circle cx="160" cy="462" r="82" fill="#F4EBDF"/>
    <text x="160" y="450" text-anchor="middle" fill="#231F1A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="38" font-weight="700">01</text>
    <text x="160" y="492" text-anchor="middle" fill="#4A4036" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">kennismaken</text>
  </g>
  <g>
    <circle cx="452" cy="462" r="82" fill="#DDE6DF"/>
    <text x="452" y="450" text-anchor="middle" fill="#231F1A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="38" font-weight="700">02</text>
    <text x="452" y="492" text-anchor="middle" fill="#4A4036" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">intake</text>
  </g>
  <g>
    <circle cx="748" cy="462" r="82" fill="#F7D8C8"/>
    <text x="748" y="450" text-anchor="middle" fill="#231F1A" font-family="Avenir Next, Segoe UI, sans-serif" font-size="38" font-weight="700">03</text>
    <text x="748" y="492" text-anchor="middle" fill="#4A4036" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">sessies</text>
  </g>
  <g>
    <circle cx="1040" cy="462" r="82" fill="#BF6D48"/>
    <text x="1040" y="450" text-anchor="middle" fill="#FBF7F1" font-family="Avenir Next, Segoe UI, sans-serif" font-size="38" font-weight="700">04</text>
    <text x="1040" y="492" text-anchor="middle" fill="#FBF7F1" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20">evalueren</text>
  </g>
  <rect x="92" y="626" width="1016" height="92" rx="30" fill="#FBF7F1" opacity="0.08"/>
  <text x="128" y="682" fill="#FBF7F1" font-family="Avenir Next, Segoe UI, sans-serif" font-size="25">Eerst kijken of coaching past. Daarna pas verder bouwen.</text>
</svg>
